<svg width="520" height="150" viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Partido Teste">
  <defs>
    <linearGradient id="pt-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153458"/>
      <stop offset="1" stop-color="#0C1E33"/>
    </linearGradient>
    <linearGradient id="pt-orange" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E0521F"/>
      <stop offset="1" stop-color="#F2663C"/>
    </linearGradient>
  </defs>

  <!-- Emblema -->
  <rect x="10" y="15" width="120" height="120" rx="30" fill="url(#pt-navy)"/>
  <!-- Barras ascendentes (progresso) -->
  <rect x="40"  y="86" width="15" height="30" rx="5" fill="#5A6B82"/>
  <rect x="62"  y="70" width="15" height="46" rx="5" fill="#8A9099"/>
  <rect x="84"  y="52" width="15" height="64" rx="5" fill="url(#pt-orange)"/>
  <!-- Estrela / liderança -->
  <path d="M91.5 26 l4.4 9 9.9 1.4 -7.2 7 1.7 9.9 -8.8 -4.7 -8.8 4.7 1.7 -9.9 -7.2 -7 9.9 -1.4 z" fill="#F2663C"/>

  <!-- Assinatura -->
  <text x="152" y="70" font-family="'Inter','Segoe UI',sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5" fill="#153458">PARTIDO</text>
  <text x="152" y="112" font-family="'Inter','Segoe UI',sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5" fill="#F2663C">TESTE</text>
  <!-- Número (placeholder de urna) -->
  <rect x="356" y="80" width="66" height="34" rx="17" fill="#153458"/>
  <text x="389" y="104" font-family="'Inter','Segoe UI',sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">00</text>
</svg>
