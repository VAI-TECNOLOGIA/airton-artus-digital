<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sem conexão — Airton Artus Digital</title>
<style>
  :root { --navy:#1B1D39; --gold:#E8AF3C; }
  * { box-sizing:border-box; margin:0; }
  body {
    min-height:100vh; display:grid; place-items:center; text-align:center;
    background:var(--navy); color:#fff; padding:32px calc(20px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .tricolor { position:fixed; top:0; left:0; right:0; height:6px;
    background:linear-gradient(90deg,#398254 0 33.3%,#BD2E2F 33.3% 66.6%,var(--gold) 66.6% 100%); }
  .mark { width:72px; height:72px; border-radius:18px; margin:0 auto 20px;
    background:rgba(232,175,60,.14); border:1px solid rgba(232,175,60,.4);
    display:grid; place-items:center; font-size:34px; }
  h1 { font-size:22px; margin-bottom:10px; letter-spacing:.02em; }
  p { color:rgba(255,255,255,.75); font-size:15px; line-height:1.6; max-width:320px; margin:0 auto 28px; }
  button {
    background:linear-gradient(135deg,var(--gold),#D99C22); color:#0C0D1D; border:0;
    font-size:16px; font-weight:800; padding:15px 34px; border-radius:14px; cursor:pointer;
    box-shadow:0 12px 30px rgba(232,175,60,.35); font-family:inherit;
  }
  button:active { transform:scale(.98); }
</style>
</head>
<body>
  <div class="tricolor"></div>
  <main>
    <div class="mark">📡</div>
    <h1>Sem conexão com a internet</h1>
    <p>Não foi possível carregar o Airton Artus Digital. Verifique sua conexão Wi-Fi ou dados móveis e tente novamente.</p>
    <button onclick="window.location.href='https://app.airtonartus.com.br'">Tentar novamente</button>
  </main>
</body>
</html>
