services:
  db:
    image: postgres:16-alpine
    container_name: aad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aad
      POSTGRES_PASSWORD: aad_secret
      POSTGRES_DB: airton_artus
    ports:
      - "5432:5432"
    volumes:
      - aad_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aad -d airton_artus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aad_pgdata:
